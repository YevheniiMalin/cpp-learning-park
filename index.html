<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Learn C++ and Python by writing code through 120 practical exercises in five languages.">
  <meta property="og:title" content="Code Knowledge Park | C++ and Python">
  <meta property="og:description" content="120 practical coding exercises, clear beginner explanations and instant feedback.">
  <meta property="og:image" content="assets/preview.png">
  <title>Code Knowledge Park | C++ and Python</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="portal-page">
    <header class="portal-topbar">
      <a class="brand" href="./"><span class="portal-mark">&lt;/&gt;</span><span><strong id="brand"></strong><small id="brandSub"></small></span></a>
      <div class="language-switcher" id="languageSwitcher" role="group" aria-label="Language">
        <button data-language="en" title="English">EN</button><button data-language="fi" title="Suomi">FI</button><button data-language="uk" title="Українська">UA</button><button data-language="ru" title="Русский">RU</button><button data-language="th" title="ไทย">TH</button>
      </div>
    </header>
    <section class="portal-hero" id="top">
      <p class="eyebrow"><span>●</span> <b id="eyebrow"></b></p>
      <h1><span id="titleTop"></span><br><em id="titleBottom"></em></h1>
      <p class="lead" id="lead"></p>
      <div class="portal-stats"><div><strong>120</strong><span id="tasks"></span></div><div><strong>12</strong><span id="stations"></span></div><div><strong>5</strong><span id="languages"></span></div></div>
    </section>
    <section class="portal-courses" aria-labelledby="choose">
      <div class="section-heading"><p class="kicker">01 / 02</p><h2 id="choose"></h2></div>
      <div class="course-grid">
        <a class="course-card cpp-card" href="cpp/">
          <div class="course-card-top"><span class="course-index">01</span><span class="course-symbol">C++</span></div>
          <div class="course-card-copy"><p>C++</p><h3 id="cppName"></h3><span id="cppDesc"></span><div class="topic-list" id="cppTopics"></div></div>
          <div class="course-card-bottom"><div><small id="cppProgressLabel"></small><strong id="cppProgress"></strong></div><span class="open-course"><b id="cppOpen"></b> ↗</span></div>
        </a>
        <a class="course-card python-card" href="python/">
          <div class="course-card-top"><span class="course-index">02</span><span class="course-symbol">Py</span></div>
          <div class="course-card-copy"><p>Python</p><h3 id="pythonName"></h3><span id="pythonDesc"></span><div class="topic-list" id="pythonTopics"></div></div>
          <div class="course-card-bottom"><div><small id="pythonProgressLabel"></small><strong id="pythonProgress"></strong></div><span class="open-course"><b id="pythonOpen"></b> ↗</span></div>
        </a>
      </div>
      <p class="save-note"><span>●</span><b id="savedLocally"></b></p>
    </section>
    <footer class="portal-footer"><span class="portal-mark">&lt;/&gt;</span><p id="footer"></p><a href="#top">↑</a></footer>
  </main>
  <script src="portal-content.js"></script>
  <script src="app.js"></script>
</body>
</html>
